# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# 1.16.1 specifically (not 1.16 or 1.16.5) - matches MCSR Ranked's target
# version, since worldgen differs between 1.16.1 and later 1.16.x patches.
# check compatible versions at https://fabricmc.net/develop
minecraft_version=1.16.1
yarn_mappings=1.16.1+build.21
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
version=0.1.0
group=com.speedrunmcalt

# Dependencies
# Fabric API version tags a compatible MC minor-version range, not every
# patch individually, so +1.16 (from the official 1.16 template) covers
# 1.16.1 too - this is a deliberately newer build than what a naive
# "1.16.1"-tagged search on Modrinth would surface.
fabric_api_version=0.42.0+1.16
