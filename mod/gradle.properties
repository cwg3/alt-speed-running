# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# 1.16.1 specifically (not 1.16 or 1.16.5) - matches the incumbent's target
# version, since worldgen differs between 1.16.1 and later 1.16.x patches.
# check compatible versions at https://fabricmc.net/develop
minecraft_version=1.16.1
yarn_mappings=1.16.1+build.21
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
version=0.1.0
group=com.speedrunmcalt

# Dependencies
# 0.42.0+1.16 (the official 1.16 template's pin) actually requires MC
# 1.16.2+ internally (its Biome API v1 submodule needs a biome-registry
# change that doesn't exist until 1.16.2) - confirmed by Fabric Loader
# refusing to load it against 1.16.1. This is the newest build Modrinth
# tags specifically for 1.16.1.
fabric_api_version=0.18.0+build.387-1.16.1
